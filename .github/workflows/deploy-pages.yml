# Publica o Finanças Pro no GitHub Pages a cada push na branch principal.
#
# O app é inteiramente client-side (os dados vivem no localStorage do navegador),
# então um site estático serve. A única parte que precisa de servidor é a rota
# /api/cotacoes — ela é removida antes de compilar, porque route handler que lê a
# Request não sobrevive ao `output: 'export'`. A tela de investimentos já trata a
# ausência dela e explica o motivo a quem clicar em "Atualizar cotações".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar manualmente pela aba Actions, sem precisar de um commit novo.
  workflow_dispatch:

# Permissões mínimas que o deploy de Pages exige.
permissions:
  contents: read
  pages: write
  id-token: write

# Se você empurrar dois commits seguidos, o segundo espera o primeiro terminar
# em vez de os dois brigarem pelo mesmo ambiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Remover a rota de API
        # O export estático não compila route handlers que dependem da Request.
        run: rm -rf src/app/api

      - name: Compilar o site estático
        env:
          EXPORT_ESTATICO: '1'
          # O site fica em usuario.github.io/NOME-DO-REPO, então o app precisa
          # saber que mora numa subpasta. Lido do próprio repositório: renomear
          # o repo não quebra o build.
          BASE_PATH: /${{ github.event.repository.name }}
          # Credenciais do Supabase, com fallback para os valores do projeto.
          #
          # Por que os valores aparecem aqui em texto, num repositório público:
          # estas duas chaves são projetadas para serem públicas. Elas vão
          # embutidas no bundle JavaScript de qualquer forma — qualquer pessoa
          # que abrir o site consegue lê-las no DevTools. Escondê-las num Secret
          # daria sensação de proteção sem proteger nada.
          #
          # O que realmente protege os dados é o Row Level Security no Postgres,
          # que só devolve linhas do usuário autenticado. Isso foi verificado:
          # sete testes confirmam que um usuário não lê, não altera, não exclui
          # e não grava em nome de outro.
          #
          # O que NÃO pode aparecer aqui, nunca: a chave `sb_secret_...` e a
          # senha do banco. Essas ignoram o RLS.
          #
          # Secret ou Variable do repositório, se cadastrados, têm precedência —
          # é só criar com estes nomes que o fallback deixa de ser usado.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://vkvghaejjxrivespyajo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_OiAUGP5MY1HDhLiBz_TkEg_0YXvWRks' }}
        run: npm run build

      - name: Conferir se as credenciais entraram no build
        # Sem isto, um segredo faltando gera um site que compila e publica, mas
        # não deixa ninguém entrar — e a causa só apareceria no navegador.
        run: |
          if grep -rqs "supabase.co" out/_next/static; then
            echo "Credenciais do Supabase presentes no bundle."
          else
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL não chegou ao build. O site vai subir, mas a tela de login pedirá configuração. Cadastre os valores em Settings → Secrets and variables → Actions."
          fi

      - name: Desativar o Jekyll
        # Sem isso o Pages ignora a pasta _next, que começa com underscore.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
